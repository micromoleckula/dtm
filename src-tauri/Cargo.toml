[package]
name = "retro-garage-drift-3d"
version = "0.1.0"
description = "Retro Garage & Drift 3D Desktop Game"
authors = ["Dev"]
edition = "2021"

[lib]
name = "retro_garage_drift_3d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-fs = "2.7.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
